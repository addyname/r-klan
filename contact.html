<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>R-Klan</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <script src="js/components.js" defer></script>
    <script src="js/script.js" defer></script>
    <!-- If you prefer to keep your script links in the <head>, add the word defer. This tells the browser to wait until the HTML is fully loaded before running the script. -->
  </head>

  <body>
    <!------------------------------------------------- Header ------------------------------------------------->
    <div id="loader-wrapper">
      <div class="gradient-spinner"></div>
    </div>
    <site-header></site-header>
    <!------------------------------------------------- Header ------------------------------------------------->

    <!------------------------------------------------- Banner ------------------------------------------------->
    <section id="innerPageBanner" class="inner-page-banner">
      <div class="container">
        <div class="row">
          <h1><b>Contact Us</b></h1>
        </div>
        <div class="row">
          <figure class="banner-img">
            <img src="images/contact-banner-bg.jpg" alt="Contact Banner" />
          </figure>
        </div>
      </div>
    </section>
    <!------------------------------------------------- Banner ------------------------------------------------->

    <!------------------------------------------------- Get In Touch ------------------------------------------------->
    <section id="getInTouch" class="get-in-touch">
      <div class="container">
        <div class="row">
          <div class="col img">
            <img src="images/get-in-touch-img.jpg" alt="flight" />
          </div>
          <div class="col content">
            <h2><b>Get In Touch</b></h2>
            <form class="contact-form" action="#" method="get">
              <input type="text" name="name" id="fullName" placeholder="Name" required />
              <input
                type="email"
                name="email"
                id="emailAddress"
                placeholder="Email"
                required
              />
              <input
                type="tel"
                name="phone"
                id="phoneNumber"
                placeholder="Phone"
                required
              />
              <textarea
                name="message"
                id="formMessage"
                placeholder="Message"
              ></textarea>
              <button type="submit" class="submit-btn">
                SUBMIT <i class="fa-solid fa-arrow-right-long"></i>
              </button>
            </form>
          </div>
        </div>
      </div>
    </section>
    <!------------------------------------------------- Get In Touch ------------------------------------------------->

    <!------------------------------------------------- Footer ------------------------------------------------->
    <site-footer></site-footer>
    <!------------------------------------------------- Footer ------------------------------------------------->
  </body>
</html>
